<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul li:first-child{
            background-color: red;
        }
        ul li:last-child{
            background-color: aqua;
        }
        ul li:nth-child(4){
            background-color: rebeccapurple;
        }
        ul li:nth-child(even){
            background-color: aqua;
        }
        ul li:nth-child(odd){
            background-color: lightcoral;
        }
        ul li:nth-last-child(2){
            background-color: red;
        }
        .main{
            height: 200px;
            width: 200px;
            border: 2px solid;
            transition: 1s;
        }
        /* prenet to prenet */
        /* prevetn to child */
        .main:hover{
            background-color: lightcoral;
            transform: translate(100px);
            border-radius: 60px;
            
        }
        input:focus{
            background-color: aqua;
            color: red;
            border: 2px solid green;
            outline: 2px solid green;
        }
    </style>
</head>
<body>
    <!-- : class  -->
    <!-- :: element  -->

    <ul>
        <li>one</li>
        <li>two</li>
        <li>three</li>
        <li>four</li>
        <li>five</li>
        <li>six</li>
        <li>seven</li>
    </ul>

    <div class="main">

    </div>

    <input type="text" placeholder="Enter your name" name="" id="">
</body>
</html>
